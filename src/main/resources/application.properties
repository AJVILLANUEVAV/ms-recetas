quarkus.http.port=8080

# TODO 2: URL de conexion al servidor de desarrollo de Vault
quarkus.vault.url=http://localhost:8200

# TODO 3: autenticacion por token. Se toma de VAULT_TOKEN; si no existe usa el token del modo dev.
quarkus.vault.authentication.client-token=${VAULT_TOKEN:root}

# TODO 4: ruta KV (motor kv-v2 "secret") desde la cual se cargan los secretos (RN-06)
quarkus.vault.kv-secret-engine-version=2
quarkus.vault.kv-secret-engine-mount-path=secret
quarkus.vault.secret-config-kv-path=clinica/ms-recetas
